<html>
<head>

<title>PAKET SOTO AYAM</title>
</head>

<body>
    <header>
    <h1>🎮 Kulakoding Game Studio</h1>
    <p>Studio game kreatif untuk semua</p>
</header>

</body>

<section>
    <h2>Selamat Datang di Studio Kami!</h2>
    <p>Kami membuat game sederhana yang seru dan menyenangkan.</p>
</section>
<section>
    <h2>🎮 Game Kami</h2>
    <div class="game-box">
        <h3>Game Scratch Saya</h3>
        <p>Game Scratch akan ditampilkan di sini.</p>
    </div>
</section>


<h1>PAKET SOTO AYAM</h1>
<p>Harga Paket Soto Ayam</p>
<section>
    <h2>💰 Pesan Game Custom</h2>

    <input type="text" id="paket"
    placeholder="Basic / Standard / Premium">

    <button onclick="hitung()">Hitung Harga</button>

    <p id="hasil"></p>
</section>


<button onclick="hitungHarga()">Hitung Harga</button>
<p id="hasil"></p>
<script>
function hitungHarga() {
let paket = document.getElementById("paket").value;
let harga;
if (paket == "Basic") {
harga = 100000;
} else if (paket == "Standard") {
harga = 250000;
} else if (paket == "Premium") {
harga = 500000;
} else if (paket == "Suprame") {
harga = 1000000;
} else {
harga = 0;
}
document.getElementById("hasil").innerHTML =
"Harga paket: Rp" + harga;
}
</script>
</body>
